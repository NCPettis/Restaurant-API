<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="restaurant-api.css">
    <title>Rstaurant API</title>
</head>
<body>

 <section id="webApp">
    <h1>Find My Local Foodbank</h1>

    <p> Here in the UK we don't like to waste food that can help those in need. Cities like <strong>Bedford, London, and Notting Hill</strong> are teaming with food banks happy to take on extra ingrediants or meals</p>

    
    <label for="cityInput">Enter City</label>
    <input type="search" id="cityInput" name="q" />
    <button>Search Here</button>

     <p id="foodBanks"></p>

     <table> 
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Location</th>
            <th scope="col">Food Needed</th>
        </tr>
    </table>
</section>
     

    <script src="restaurant-api.js"></script>
</body>
</html>
